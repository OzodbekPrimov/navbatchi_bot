[project]
name = "navbatchi-bot"
version = "0.1.0"
description = "Food-duty rotation Telegram bot for a shared room"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4.0",
    "SQLAlchemy[asyncio]>=2.0.40,<3.0",
    "asyncpg>=0.30,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "tzdata>=2025.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "aiosqlite>=0.21,<1.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
